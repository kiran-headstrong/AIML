apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeromanual-api
  namespace: aeromanual
  labels:
    app: aeromanual-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aeromanual-api
  template:
    metadata:
      labels:
        app: aeromanual-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: aeromanual-ai:latest
          env:
            - name: SERVICE
              value: "api"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aeromanual-secrets
                  key: GROQ_API_KEY
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: vectorstore
              mountPath: /app/vectorstore
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: vectorstore
          persistentVolumeClaim:
            claimName: vectorstore-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aeromanual-api
  namespace: aeromanual
spec:
  selector:
    app: aeromanual-api
  ports:
    - port: 8000
      targetPort: 8000
