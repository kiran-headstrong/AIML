apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeromanual-ui
  namespace: aeromanual
  labels:
    app: aeromanual-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeromanual-ui
  template:
    metadata:
      labels:
        app: aeromanual-ui
    spec:
      containers:
        - name: ui
          image: aeromanual-ai:latest
          env:
            - name: SERVICE
              value: "ui"
            - name: API_URL
              value: "http://aeromanual-api:8000"
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aeromanual-ui
  namespace: aeromanual
spec:
  type: LoadBalancer
  selector:
    app: aeromanual-ui
  ports:
    - port: 80
      targetPort: 8501
