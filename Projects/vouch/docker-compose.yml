services:
  db:
    image: postgres:16
    container_name: vouch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vouch
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vouch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vouch_pgdata:
