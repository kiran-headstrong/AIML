<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Assistant</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App shell. The router swaps content into #view. The sidebar/navbar are
       hidden on the auth screen and shown once the user is authenticated. -->
  <div id="app">
    <!-- Top navigation bar -->
    <header id="navbar" class="navbar" hidden>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="#/dashboard" class="brand">
        <span class="brand-mark">JA</span>
        <span class="brand-text">Job Application Assistant</span>
      </a>
      <div class="navbar-spacer"></div>
      <div class="navbar-user">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Log out</button>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar navigation -->
      <aside id="sidebar" class="sidebar" hidden>
        <nav class="nav">
          <a class="nav-link" href="#/dashboard" data-route="dashboard">
            <span class="nav-icon">▣</span> Dashboard
          </a>
          <a class="nav-link" href="#/jd" data-route="jd">
            <span class="nav-icon">🔗</span> Scrape JD
          </a>
          <a class="nav-link" href="#/resume" data-route="resume">
            <span class="nav-icon">📄</span> My Resume
          </a>
          <a class="nav-link" href="#/match" data-route="match">
            <span class="nav-icon">🎯</span> Match &amp; Suggestions
          </a>
          <a class="nav-link" href="#/interview" data-route="interview">
            <span class="nav-icon">🎤</span> Interview Prep
          </a>
          <a class="nav-link" href="#/cover-letter" data-route="cover-letter">
            <span class="nav-icon">✉️</span> Cover Letter
          </a>
          <a class="nav-link" href="#/compare" data-route="compare">
            <span class="nav-icon">⚖️</span> Compare JDs
          </a>
        </nav>
      </aside>

      <!-- Sidebar backdrop for mobile -->
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <!-- Main content area populated by the router -->
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <!-- Global toast/notification container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- Scripts: order matters. app.js defines the core (API client, router,
       store) and exposes a global `App`. Page modules register their views. -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/placeholders.js"></script>
  <!-- Feature pages: loaded after placeholders.js so they override the stubs. -->
  <script src="js/pages/jd.js"></script>
  <script src="js/pages/resume.js"></script>
  <script src="js/pages/match.js"></script>
  <script src="js/pages/interview.js"></script>
  <script src="js/pages/cover_letter.js"></script>
  <script src="js/pages/compare.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script>
    // Boot the application once all modules are loaded.
    window.addEventListener('DOMContentLoaded', function () {
      App.start();
    });
  </script>
</body>
</html>
