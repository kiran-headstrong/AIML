# nginx site config for the Job Application Assistant SPA.
#
# Serves the static frontend and reverse-proxies API traffic to the backend
# container so the browser only ever talks to a single origin.

upstream backend {
    # "backend" is the service name in docker-compose.yml.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # SPA static assets with hash-based routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and backend utility routes to the FastAPI service.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend/health;
    }

    location /docs {
        proxy_pass http://backend/docs;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
    }
}
