# Alembic configuration for the Job Application Assistant backend.
#
# The database URL is NOT hard-coded here; it is loaded at runtime from the
# application settings (backend.config.settings.database_url) inside
# migrations/env.py. The sqlalchemy.url below is a harmless placeholder.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = migrations

# Template used to generate migration file names; includes a date prefix.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the file_template date values.
timezone = UTC

# Placeholder; overridden by env.py using settings.database_url.
sqlalchemy.url = postgresql+asyncpg://localhost/job_application_assistant


[post_write_hooks]
# No post-write hooks configured.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
